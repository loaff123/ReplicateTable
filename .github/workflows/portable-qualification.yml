name: Portable eager-memory qualification

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  exact-public-profile:
    name: ${{ matrix.profile }} source and installed wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [public312, public313]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          persist-credentials: false
      - name: Record ordinary hosted runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          uname -a > "$RUNNER_TEMP/qualification/runner.txt"
          cat /etc/os-release >> "$RUNNER_TEMP/qualification/runner.txt"
          printf '\nImageOS=%s\nImageVersion=%s\nGITHUB_SHA=%s\n' "$ImageOS" "$ImageVersion" "$GITHUB_SHA" >> "$RUNNER_TEMP/qualification/runner.txt"
          python3 -I -S -B -c 'import sys; assert sys.version_info >= (3, 12); assert not sys.flags.optimize'
      - name: Acquire and verify immutable public runtime
        id: runtime
        shell: bash
        run: bash qualification/prepare_profile.sh '${{ matrix.profile }}' "$RUNNER_TEMP/exact-runtime"
      - name: Test actual source workflow and native refusal
        shell: bash
        run: |
          python3 -I -S -B qualification/run_cell.py \
            --runtime "$RUNNER_TEMP/exact-runtime" --profile '${{ matrix.profile }}' \
            --lane source --output "$RUNNER_TEMP/qualification/source"
      - name: Test isolated installed wheel workflow and native refusal
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: bash
        run: |
          python3 -I -S -B qualification/run_cell.py \
            --runtime "$RUNNER_TEMP/exact-runtime" --profile '${{ matrix.profile }}' \
            --lane wheel --output "$RUNNER_TEMP/qualification/wheel"
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ matrix.profile }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qualification/runner.txt
            ${{ runner.temp }}/qualification/*/cell.json
            ${{ runner.temp }}/qualification/*/runtime-preflight.json
            ${{ runner.temp }}/qualification/*/wheel-runtime-preflight.json
            ${{ runner.temp }}/qualification/*/harness-manifest.json
            ${{ runner.temp }}/qualification/*/product-manifest.json
            ${{ runner.temp }}/qualification/*/*.log
            ${{ runner.temp }}/qualification/*/probe/receipt.json
            ${{ runner.temp }}/qualification/*/probe/exports/*
