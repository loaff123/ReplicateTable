[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "replicatetable"
version = "0.1.0a1"
description = "Bounded source-bound eager-memory tables, replay and experimental bundles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ReplicateTable contributors"}]
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "xarray==2026.4.0", "pint==0.25.2",
  "h5py==3.16.0", "h5netcdf==1.8.1", "flexcache==0.3", "flexparser==0.4",
  "platformdirs==4.12.3", "typing-extensions==4.16.0", "packaging==26.3",
  "python-dateutil==2.9.0.post0", "pytz==2026.5", "tzdata==2026.5", "six==1.17.0",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
